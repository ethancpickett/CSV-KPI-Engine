version: '3.8'

services:
  backend:
    build: ./backend
    container_name: kpi_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=sqlite:///./financial_analyzer.db

  frontend:
    build: ./frontend
    container_name: kpi_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend